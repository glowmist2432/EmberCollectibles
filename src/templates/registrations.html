
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Plates - Ember Collectibles</title>

    <style>

        @font-face {
            font-family: "License-Plate";
            src: url("{{ url_for('static', filename='fonts/CharlesWright-Bold.otf') }}") format("truetype");
        }


        header {
            background-color: #73B7A6;
            color: #FCFBF4;
            text-align: center;
            padding: 10px;
        }

        body {
            background-color: #C1DBD2;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        ul.navBar {
            display: flex;
            list-style-type: none;
            margin: 0;
            padding: 0;
            background-color: #339378;
        }

        ul.navBar li a {
            display: block;
            color: #FCFBF4;
            text-decoration: none;
            padding: 14px 20px;
        }

        ul.navBar li a:hover {
            background-color: #73B7A6;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #339378;
        }

        .plate-counter {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #339378;
        }

        #plateList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .plate {
            background-color: #FCFBF4;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #73B7A6;
            font-family: "License-Plate";
        }

        .plate.collected {
            background-color: #FED100;
            border-color: #339378;
        }

        .plate.uncollected {
            opacity: 0.55;
        }

        .registration {
            font-size: 20px;
            font-weight: bold;
        }

        .collected-label {
            color: #FCFBF4;
            font-weight: bold;
        }

        .uncollected-label {
            color: #666;
            font-size: 14px;

        }

                /* =========================
           NAVIGATION
        ========================= */

        .navbar {
            background-color: #212121;
            min-height: 70px;
            padding: 0 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        .logo {
            color: #FCFBF4;
            text-decoration: none;

            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 23px;
            font-weight: bold;
        }

        .logo-icon {
            font-size: 26px;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            color: #FCFBF4;
            text-decoration: none;

            padding: 11px 16px;
            border-radius: 8px;

            font-size: 15px;

            transition: 0.2s ease;
        }

        .nav-link:hover {
            background-color: #73B7A6;
        }

        .nav-link.active {
            background-color: #73B7A6;
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav class="navbar">

        <a href="/" class="logo">
            <img class="logo-icon" src="{{ url_for('static', filename='images/emberLogo.png') }}" width="50"></img>
            Ember Collectibles
        </a>

        <div class="nav-links">

            <a href="/" class="nav-link">
                Home
            </a>

            <a href="/registrations" class="nav-link">
                Registrations
            </a>

            <a href="/collectibles" class="nav-link">
                Collectibles
            </a>

        </div>

    </nav>


    <div class="container">

        <h1>Registration Plates</h1>


        <!-- Collection counter -->
        <div class="plate-counter">

            {{ collected|length }}/{{ registrations|length }}

            Registration Plates Collected

        </div>


        <!-- Registration list -->
        <div id="plateList">

            {% for plate in registrations %}

                {% if plate in collected %}

                    <!-- COLLECTED REGISTRATION -->
                    <div class="plate collected">

                        <span class="registration">
                            {{ plate }}
                        </span>

                        <span class="collected-label">
                            ✓ Collected
                        </span>

                    </div>

                {% else %}

                    <!-- UNCOLLECTED REGISTRATION -->
                    <div class="plate uncollected">

                        <span class="registration">
                            {{ plate }}
                        </span>

                        <span class="uncollected-label">
                            Not collected
                        </span>

                    </div>

                {% endif %}

            {% endfor %}

        </div>

    </div>

</body>
</html>
